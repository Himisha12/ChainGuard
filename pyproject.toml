[project]
name = "chainguard"
version = "0.1.0"
description = "AI-powered multi-agent dependency vulnerability scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Himisha Tunwal" }]

dependencies = [
    # Core framework
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Data & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    # RAG
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Knowledge graph
    "networkx>=3.4.0",
    # HTTP
    "httpx>=0.27.0",
    # Guardrails
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    # Observability
    "structlog>=24.0.0",
    # Frontend
    "streamlit>=1.40.0",
    # Export
    "fpdf2>=2.8.0",
    # Utilities
    "toml>=0.10.2",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
chainguard = "src.main:main"
opspilot = "src.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
